name: Daten aktualisieren und Seite veröffentlichen

# Automatik:
#  - Cloudflare-Dienst: alle 5 Minuten Blick in data/fenster.json; ist gerade ein Spiel der eigenen
#    Mannschaften vorbei, startet er diesen Workflow (workflow_dispatch, Modus auto). GitHub selbst
#    startet die 15-Minuten-Zeitpläne oft nur etwa stündlich.
#  - alle 15 Minuten: kurzer Blick, ob ein Spiel gerade vorbei ist und Ergebnis oder Spielbericht
#    noch fehlen (nur dann wird nuLiga abgefragt, höchstens 6 Stunden nach Spielende)
#  - täglich früh morgens: Komplettabgleich
#  - bei jeder Änderung im Repository (z. B. manuell aus dem Claude-Chat): sofortiger Komplettabgleich
#  - neue Ergebnisse der eigenen Mannschaften: nach der Veröffentlichung Push-Mitteilung über den
#    Cloudflare-Dienst an alle, die sie für diese Mannschaft eingeschaltet haben
#  - GitHub schaltet Zeitpläne nach 60 Tagen ohne Aktivität ab (z. B. Sommerpause): der tägliche
#    Lauf hält den Workflow aktiv und schreibt alle 25 Tage eine kleine Markierung ins Repository
on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '23 3 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modus'
        type: choice
        options: [auto, daily, force]
        default: auto

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

env:
  DIENST_URL: https://esv-handball.esv-eicken.workers.dev

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.upd.outputs.changed }}
      push: ${{ steps.upd.outputs.push }}
    steps:
      - uses: actions/checkout@v6

      - name: nuLiga abfragen
        id: upd
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && echo "$INPUT_MODE" | grep -qx 'auto\|daily\|force'; then MODE=$INPUT_MODE
          elif [ "$EVENT" = "push" ]; then MODE=force
          elif [ "$SCHEDULE" = "23 3 * * *" ]; then MODE=daily
          else MODE=auto; fi
          echo "Modus: $MODE"
          python3 -m pip install -q --user --break-system-packages beautifulsoup4 || true
          python3 scripts/update.py --mode "$MODE"

      - name: Neue Daten speichern
        if: steps.upd.outputs.changed == 'true'
        env:
          MSG: ${{ steps.upd.outputs.message }}
          DETAILS: ${{ steps.upd.outputs.details }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then exit 0; fi
          printf '%s\n\n%s\n' "$MSG" "$DETAILS" | git commit -q -F -
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep 5
          done

      - name: Automatik aktiv halten
        if: github.event.schedule == '23 3 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api -X PUT "repos/$REPO/actions/workflows/update.yml/enable" >/dev/null && echo "Workflow aktiv" || echo "::warning::Workflow konnte nicht bestätigt werden"
          F=.github/keepalive.txt
          LAST=$(cat "$F" 2>/dev/null | head -1)
          AGE=999
          [ -n "$LAST" ] && AGE=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s 2>/dev/null || echo 0) ) / 86400 ))
          echo "Letzte Markierung: ${LAST:-keine} (vor $AGE Tagen)"
          if [ "$AGE" -ge 25 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898+github-actions[bot]@users.noreply.github.com"
            git pull -q --rebase origin main
            date -u +%F > "$F"
            printf '%s\n' "# Markierung, damit GitHub die Automatik in Ruhephasen nicht abschaltet" >> "$F"
            git add "$F"
            git commit -q -m "Automatik aktiv halten"
            for i in 1 2 3; do
              git pull -q --rebase origin main && git push -q origin HEAD:main && break
              sleep 5
            done
          fi

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp index.html version.json manifest.webmanifest apple-touch-icon.png icon-192.png icon-512.png esv-rund.png sw.js .nojekyll _site/
          cp -r data _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v5
      # GitHub findet das gerade hochgeladene Paket manchmal erst mit Verzögerung: einmal neu versuchen
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - id: deploy
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5

      # Neue Ergebnisse erst melden, wenn die Seite sie schon zeigt
      - name: Mitteilungen senden
        if: "!cancelled() && needs.update.outputs.push != '' && needs.update.outputs.push != '[]' && (steps.deploy1.outcome == 'success' || steps.deploy.outcome == 'success')"
        env:
          EVENTS: ${{ needs.update.outputs.push }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [ -n "$CF_TOKEN" ] || { echo "Kein Cloudflare-Zugang hinterlegt"; exit 0; }
          KEY=$(printf 'esv-notify:%s' "$CF_TOKEN" | sha256sum | cut -c1-64)
          echo "::add-mask::$KEY"
          echo "$EVENTS" | jq -r '.[] | "• " + .title + " – " + .body'
          BODY=$(echo "$EVENTS" | jq -c '{events: .}')
          for i in $(seq 1 200); do
            R=$(curl -s -m 60 -X POST -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' --data "$BODY" "$DIENST_URL/notify" || echo '{"error":"keine-verbindung"}')
            echo "$R" | jq -c '{neu: (.events // [] | length), offen: .rest, gesendet: .sent, fehler: .failed, entfernt: .removed, codes, error}' 2>/dev/null || echo "$R" | head -c 300
            NEXT=$(echo "$R" | jq -r '.next // empty' 2>/dev/null)
            [ -n "$NEXT" ] || break
            BODY=$(echo "$R" | jq -c --arg n "$NEXT" '{events: .events, after: $n}')
          done
